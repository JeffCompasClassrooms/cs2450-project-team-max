name: Run Selenium Test
on:
  push:
    branches:
      - Bryce
  pull_request:
    branches:
      - Bryce
jobs:
  selenium:
    runs-on: ubuntu-latest
    services:
      selenium:
        image: selenium/standalone-chrome:latest
        options: --shm-size=2g
        ports:
          - 4444:4444

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install selenium pytest pytest-selenium

      - name: Start Flask App in the background
        run: |
          nohup python youface.py > flask.log 2>&1 & 
          echo $! > flask.pid
          sleep 10
          cat flask.log

      - name: Run Selenium BryceTests
        run: |
          pytest tests/selenium -v

      - name: Upload Flask logs if tests fail
        if: ${{ failure() }}
        uses: actions/upload-artifact@v3
        with:
          name: flask-logs
          path: flask.log
