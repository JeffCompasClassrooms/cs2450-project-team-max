<!DOCTYPE html>
{% extends "base.html" %}
{% block title %}Create Profile{% endblock %}

{% block content %}

<!-- call the css for this page -->
<head><link rel="stylesheet" href="{{ url_for('static', filename='profile.css') }}"></head>

<div class="row">
  <div class="col-sm-6 mx-auto">
    <div class="card card-body bg-light">
      <form id="profileForm" method="post" action="/profile">
        <input  type="hidden"id="latitude" name="latitude" value="">
        <input  type="hidden" id="longitude"name="longitude" value=""> 
        <fieldset>
          <legend>Create Profile</legend>
          <hr />
          <div class="form-group">
            <label for="fullName">Enter your name</label>
            <input type="text" class="form-control" name="Fullname" >
          </div>
          <div class="form-group">
            <label for="age">Enter your age</label>
            <input type="number" class="form-control" name="age" >
          </div>
          <div class="form-group">
            <label for="instrument">What instrument(s) do you play?</label>
            <select multiple="instruments" id="instrument" name="instrument" class="form-control">
              <option value="guitar">Guitar</option>
              <option value="piano">Piano</option>
              <option value="drums">Drums</option>
              <option value="bass">Bass</option>
              <option value="violin">Violin</option>
              <option value="flute">Flute</option>
              <option value="saxophone">Saxophone</option>
              <option value="vocals">Vocals</option>
              <option value="harmonica">Harmonica</option>
              <option value="banjo">Banjo</option>
              <option value="tambourine">Tambourine</option>
            </select>
          </div>
          <div class="form-group">
            <label for="experience">How many years of experience do you have with your instrument(s)?</label>
            <input type="number" class="form-control" name="experience" >
          </div>
          <div class="form-group">
            <label for="genre">What genres do you play?</label>
            <select multiple="genres" id="genre" name="genre" class="form-control">
              <option value="rock">Rock</option>
              <option value="metal">Metal</option>
              <option value="jazz">Jazz</option>
              <option value="blues">Blues</option>
              <option value="classical">Classical</option>
              <option value="indie">Indie</option>
              <option value="country">Country</option>
              <option value="hiphop">Hip Hop</option>
              <option value="reggae">Reggae</option>
              <option value="folk">Folk</option>
              <option value="punk">Punk</option>
              <option value="popPunk">Pop Punk</option>
              <option value="alternative">Alternative</option>
              <option value="shoeGaze">Shoe Gaze</option>
            </select>
          </div>
          <div class="form-group">
            <label for="covers">Do you intend to create new music or perform cover songs?</label>
            <select id="covers" name="covers" class="form-control">
              <option value="create">Create New Music</option>
              <option value="coverSongs">Perform Cover Songs</option>
          </div>
            
          <!-- Location -->
          <div class="form-group">
            <label for="countryLocation">Country</label>
            <select id="countryLocation" class="form-control" name="countryLocation"></select>
          </div>
          <div class="form-group">
            <label for="state">State/Province</label>
            <select id="state" class="form-control" name="state"></select>
          </div>
          <div class="form-group">
            <label for="city">City</label>
            <select id="city" class="form-control" name="city"></select>
          </div>

          <div class="form-group">
            <label for="travel">Are you willing to travel?</label>
            <select type="travel" class="form-control" name="travel"></select>
              <option value="yes">Yes</option>
              <option value="no">No</option>
          </div>
          <div class="form-group">
            <input class="btn btn-success" type="submit" formaction="{{ url_for('profile.profile') }}" value="save">
            <input class="btn btn-primary" type="reset" formaction="{{ url_for('profile.cancel') }}" value="cancel">
          </div>
        </fieldset>
      </form>
      <script>
        let coordsReady = false;
      
        fetch('https://ipinfo.io/json?token=a4c42020ada82e')
          .then(response => response.json())
          .then(data => {
            const [lat, long] = data.loc.split(',');
      
            document.getElementById('latitude').value = lat;
            document.getElementById('longitude').value = long;
      
            coordsReady = true; // mark as ready
          });
      
        // Wait for coords before submitting
        document.getElementById('profileForm').addEventListener('submit', function (e) {
          if (!coordsReady) {
            e.preventDefault();
            alert("Still fetching location. Please wait a moment...");
          }
        });
      </script>
    </div>
  </div>
</div>
<script>
  const fruitSelect = document.getElementById('genre');
  const choices = new Choices(fruitSelect, {
    removeItemButton: true,
    placeholderValue: 'Select fruits',
    searchPlaceholderValue: 'Search fruits'
  });
</script>
{% endblock %}
