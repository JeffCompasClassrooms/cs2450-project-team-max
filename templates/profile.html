          </div>

            <label for="covers">Do you intend to create new music or perform cover songs?</label>

              <option value="coverSongs">Perform Cover Songs</option>

          <div class="form-group">

          </div>

            <label for="travel">Are you willing to travel?</label>
            <select id="travel" class="form-control" name="travel"></select>
              <option value="yes">Yes</option>
              <option value="no">No</option>
            </select>
          </div>
          <div class="form-group">
            <label for="profilepic">Select a profile picture for others to see</label>
            <input type="file" id="mediaUpload" name="media" accept="image/*">
          </div>
          <!--Maybe add link option relevent to the user such as spotify or youtube. (url) option in the input field-->
          <div class="form-group">
              <input class="btn btn-primary" type="submit" value="save">
          </div>
        </fieldset>
      </form>
      <script>
        let coordsReady = false;
      
        fetch('https://ipinfo.io/json?token=a4c42020ada82e')
          .then(response => response.json())
          .then(data => {
            const [lat, long] = data.loc.split(',');
      
            document.getElementById('latitude').value = lat;
            document.getElementById('longitude').value = long;
      
            coordsReady = true; // mark as ready
            console.log(lat)
            console.log(long)
          });
      
        // Wait for coords before submitting
        document.getElementById('profileForm').addEventListener('submit', function (e) {
          if (!coordsReady) {
            e.preventDefault();
            alert("Still fetching location. Please wait a moment...");
          }
        });
      </script>
    </div>
  </div>
</div>

<script>
const selectedBox = document.getElementById('selected-instruments-box');
const instrumentSelect = document.getElementById('instrument-select');
const hiddenField = document.getElementById('instrument-hidden');

function updateHiddenField() {
  const tags = document.querySelectorAll('.instrument-tag');
  const values = Array.from(tags).map(tag => tag.textContent);
  document.getElementById('instruments').value = values.join(',');
}

instrumentSelect.addEventListener('change', function () {
    const selectedValue = this.value;
    const selectedText = this.options[this.selectedIndex].text;

    if (!selectedValue) return;

     // Create tag
    const tag = document.createElement('span');
    tag.className = 'instrument-tag badge badge-success mr-2';
    tag.textContent = selectedText;
    tag.dataset.value = selectedValue;
    tag.style.cursor = 'pointer';
    tag.onclick = () => {
      selectedBox.removeChild(tag);

      // Re-add option back to the dropdown
      const option = new Option(selectedText, selectedValue);
      instrumentSelect.add(option);

      updateHiddenField();
    };
    // Add tag, remove from dropdown
    selectedBox.appendChild(tag);
    instrumentSelect.remove(instrumentSelect.selectedIndex);
    instrumentSelect.selectedIndex = 0;

    updateHiddenField();
  });
  
  // After tag is created
  selectedBox.appendChild(tag);
  updateHiddenField();

  // Inside tag click event (removal)
  selectedBox.removeChild(tag);
  instrumentSelect.appendChild(option);
  updateHiddenField();

  async function loadJSON(url) {
    const response = await fetch(url);
    return await response.json();
  }

  async function populateDropdowns() {
    const countries = await loadJSON("/static/data/countries.json");
    const states = await loadJSON("/static/data/states.json");
    const cities = await loadJSON("/static/data/cities.json");

    const countrySelect = document.getElementById("countryLocation");
    const stateSelect = document.getElementById("state");
    const citySelect = document.getElementById("city");

    // Populate countries
    countries.forEach(country => {
      let option = new Option(country, country);
      countrySelect.add(option);
    });

    // When country changes
    countrySelect.addEventListener("change", function () {
      let selectedCountry = countrySelect.value;
      stateSelect.innerHTML = "";
      states[selectedCountry].forEach(state => {
        let option = new Option(state, state);
        stateSelect.add(option);
      });
      stateSelect.dispatchEvent(new Event("change"));
    });

    // When state changes
    stateSelect.addEventListener("change", function () {
      let selectedState = stateSelect.value;
      citySelect.innerHTML = "";
      cities[selectedState].forEach(city => {
        let option = new Option(city, city);
        citySelect.add(option);
      });
    });

    // Initialize first run
    countrySelect.dispatchEvent(new Event("change"));
  }

  document.addEventListener("DOMContentLoaded", populateDropdowns);
</script>
