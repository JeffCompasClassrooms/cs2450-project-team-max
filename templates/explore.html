{% extends "base.html" %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

{% block content %}
<head>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</head>
<div class="row justify-content-md-center mb-4">
  <h1 class="">EXPLORE</h1>
</div>
<div class="row justify-content-md-center mb-4">
  <h2 class="card body ">My Feed</h2>
</div>

<div class="row justify-content-md-center mb-4">
  <div id="postCarousel" class="carousel" data-bs-ride="carousel">
    <div class="carousel-inner">

      {% for others in all_users %}
      <div class="carousel-item {% if loop.first %}active{% endif %}"
        data-username="{{ others.username }}"
        data-fullname="{{ others.fullName }}"
        data-age="{{ others.age }}"
        data-genre="{{ others.genre }}">
        
        <div class="d-flex justify-content-center">
          <div class="card bg-light mb-2 p-3">
                <div class="row justify-content-md-center mb-4">
              <a class="card-title h5 mb-2" href="/{{ others.username }}">{{ others.fullName }}</a>             
            </div>
           
            <img class="profile-img mb-2" src="{{ others.profile_picture }}" alt="profile picture">
            <p class="text-muted">Genre: {{ others.genre }} | Age: {{ others.age }}</p>
          </div>
        </div>
      </div>
      {% endfor %}

    </div>

    <!-- Carousel Controls: OUTSIDE the loop -->
    <a class="carousel-control-prev" href="#postCarousel" role="button" onclick="dislike()" data-slide="prev">
      <span style="font-size:xx-large;"aria-hidden="true">👎</span>
      <span class="sr-only">Previous</span>
    </a>
    <a class="carousel-control-next" href="#postCarousel" role="button" onclick="like()" data-slide="next">
      <span style="font-size:xx-large;" aria-hidden="true">🤙</span>
      <span class="sr-only">Next</span>
    </a>
  </div>
 
</div>
<script>

  $('#postCarousel').on('slide.bs.carousel', function (event) {
    console.log(event.from);
    if (event.direction =="right"){
      $('#postCarousel').find('.carousel-i')
    }
    else{

    }
    
})
$('#postCarousel').on('slid.bs.carousel', function () {
  console.log("refresh")
})
  function dislike(){
    const $carousel = $('#postCarousel');
    const $activeSlide = $carousel.find('.carousel-item.active');
    const $nextSlide = $activeSlide.next('.carousel-item').length
      ? $activeSlide.next('.carousel-item')
      : $carousel.find('.carousel-item').first(); // wrap

    // If only 1 slide left, optionally hide carousel
    if ($carousel.find('.carousel-item').length <= 1) {
      location.reload()
      return;
    }

    // Activate next slide first
    $nextSlide.addClass('active');
    $activeSlide.remove();

  }
  function like(){


    const $carousel = $('#postCarousel');
    const $activeSlide = $carousel.find('.carousel-item.active');
    const username = $activeSlide.data('username');
    const $nextSlide = $activeSlide.next('.carousel-item').length
      ? $activeSlide.next('.carousel-item')
      : $carousel.find('.carousel-item').first(); // wrap
    
    console.log(username)
    // If only 1 slide left, optionally hide carousel
        
    fetch('/like', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ username })
  }).then(response => {
    // handle response if needed
  });
    if ($carousel.find('.carousel-item').length <= 1) {
      $activeSlide.remove();
      $('#postCarousel').hide(); // or show a message
      return;
    }

    // Activate next slide first
    $nextSlide.addClass('active');
    $activeSlide.remove();
    
  }
</script>

{% endblock %}
